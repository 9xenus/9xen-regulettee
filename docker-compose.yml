version: '3.8'

services:
  # ═══════════════════════════════════════════════════════════
  # 0. Application Server (9Xen Regulettee CaaS)
  # ═══════════════════════════════════════════════════════════
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: regulettee-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_SECRET: ${APP_SECRET:-ChangeMeAppSecretInProduction32Chars!!}
      DATABASE_URL: postgresql://regulettee_admin:${POSTGRES_PASSWORD:-ChangeMeInProduction_VaultManaged9Xen!}@postgres:5432/regulettee_core
      REDIS_URL: redis://:${REDIS_PASSWORD:-ChangeMeRedisSecret9Xen!}@redis:6379
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-ChangeMeNeo4jVaultManaged9Xen!}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-regulettee_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ChangeMeMinIOVaultPassword9Xen!}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-root-dev-token-9xen}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - regulettee-internal

  # ═══════════════════════════════════════════════════════════
  # 1. Primary Relational Store & Sovereign State (PostgreSQL 16)
  # ═══════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: regulettee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-regulettee_core}
      POSTGRES_USER: ${POSTGRES_USER:-regulettee_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeInProduction_VaultManaged9Xen!}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-regulettee_admin} -d ${POSTGRES_DB:-regulettee_core}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - regulettee-internal

  # ═══════════════════════════════════════════════════════════
  # 2. In-Memory Cache & BullMQ Event Queue (Redis 7)
  # ═══════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: regulettee-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-ChangeMeRedisSecret9Xen!}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ChangeMeRedisSecret9Xen!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - regulettee-internal

  # ═══════════════════════════════════════════════════════════
  # 3. Graph Intelligence & Entity Relationship Store (Neo4j 5)
  # ═══════════════════════════════════════════════════════════
  neo4j:
    image: neo4j:5.26-community
    container_name: regulettee-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-ChangeMeNeo4jVaultManaged9Xen!}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
    ports:
      - "7474:7474" # Neo4j Browser HTTP
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-ChangeMeNeo4jVaultManaged9Xen!} 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - regulettee-internal

  # ═══════════════════════════════════════════════════════════
  # 4. S3-Compatible Evidence & Forensic Vault (MinIO)
  # ═══════════════════════════════════════════════════════════
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-28Z
    container_name: regulettee-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-regulettee_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ChangeMeMinIOVaultPassword9Xen!}
    ports:
      - "9000:9000" # MinIO API
      - "9001:9001" # MinIO Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - regulettee-internal

  # ═══════════════════════════════════════════════════════════
  # 5. Cryptographic Key Management & Transit Secrets (HashiCorp Vault)
  # ═══════════════════════════════════════════════════════════
  vault:
    image: hashicorp/vault:1.18
    container_name: regulettee-vault
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-root-dev-token-9xen}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/data
      - vault_config:/vault/config
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - regulettee-internal

networks:
  regulettee-internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  minio_data:
  vault_data:
  vault_config:
